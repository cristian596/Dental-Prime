<html lang="%CLINIC_LANG%">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Los valores %CLINIC_*% salen de src/config/clinic.ts (vite.config.ts los sustituye). -->
    <title>%CLINIC_TITLE%</title>
    <meta name="description" content="%CLINIC_DESCRIPTION%" />
    <link rel="canonical" href="%CLINIC_URL%" />

    <meta property="og:type" content="website" />
